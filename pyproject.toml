[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-data-tools"
version = "0.1.0"
description = "Capture, auto-label, convert, split and count: small tools for building vision datasets"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rung-Chi Lin"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "opencv-python>=4.6"]

[project.optional-dependencies]
pylon = ["pypylon>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
vdt = "vision_data_tools.cli:main"

[tool.setuptools.packages.find]
include = ["vision_data_tools*"]
